"A debate: its thesis, phase clock, and aggregates. The thesis is the argument with `argumentId` 0."
type Debate {
  "`{chainId}_{debateId}` - debate IDs restart at zero on every chain, so identity carries the chain."
  id: ID!
  "The chain this debate lives on. One indexer serves them all, so a client filters on this."
  chainId: Int!
  "The on-chain debate ID, which is only unique within its chain."
  debateId: BigInt!
  creator: String!
  "The thesis text, verbatim from the DebateCreated event (1 to 256 bytes of UTF-8)."
  content: String!
  lockingDuration: BigInt!
  editingEndTime: BigInt!
  ratingEndTime: BigInt!
  "The debate's market fee in percent, chosen by its creator at creation (0-99)."
  feePercentage: BigInt!
  "The identity registry gating who may join, chosen by the creator at creation. The zero address means the debate is open to everyone; any other address is asked `isRegistered` on each join."
  identityRegistry: String!
  "Whether the tally has run. Editing, Rating, and Tallying follow from the time gates; this latch is the only stored phase fact, so consumers derive the live phase from the gates and this flag."
  finished: Boolean!
  "Whether the debate approved the thesis. Only set once `finished` is true."
  approved: Boolean
  "Vote tokens committed to the debate's markets (deposits plus net stakes)."
  totalStake: BigInt!
  argumentsCount: BigInt!
  "The number of joined accounts - the N in the bounty payout denominator."
  participantsCount: BigInt!
  "The chain time the tally ran. Only set once `finished` is true; bounty claims close CLAIM_WINDOW (7 days) after it."
  finishedAt: BigInt
  "The ERC-20 the bounty is denominated in. Unset when the debate carries no bounty."
  bountyToken: String
  "The total bounty funded (creation deposit plus top-ups), as received."
  bountyPool: BigInt!
  "The total bounty paid out to claimants so far."
  bountyClaimed: BigInt!
  "Whether the creator has swept the unclaimed remainder."
  bountySwept: Boolean!
  arguments: [Argument!]! @derivedFrom(field: "debate")
  participants: [Participant!]! @derivedFrom(field: "debate")
  bountyClaims: [BountyClaim!]! @derivedFrom(field: "debate")
  bountyFundings: [BountyFunding!]! @derivedFrom(field: "debate")
}

"One participant's bounty claim (one-shot per participant and debate)."
type BountyClaim {
  "`{chainId}_{debateId}_{account}`"
  id: ID!
  debate: Debate!
  account: String!
  "The vote tokens the participant ended with beyond the initial grant."
  excess: BigInt!
  "The bounty amount paid out."
  amount: BigInt!
  timestamp: BigInt!
}

"One bounty funding - the creation deposit or a top-up (history, append-only)."
type BountyFunding {
  "`{chainId}_{blockNumber}_{logIndex}`"
  id: ID!
  debate: Debate!
  funder: String!
  "The amount received (after any transfer fee the token takes)."
  amount: BigInt!
  "The pool after this funding."
  pool: BigInt!
  timestamp: BigInt!
}

"A node of a debate's argument tree, carrying its market reserves."
type Argument {
  "`{chainId}_{debateId}_{argumentId}`"
  id: ID!
  debate: Debate!
  "The chain this argument lives on, copied from its debate so a client can filter without a join."
  chainId: Int!
  "The on-chain argument ID, unique within its debate. The thesis is 0."
  argumentId: BigInt!
  "The parent argument. Unset for the thesis."
  parent: Argument
  creator: String!
  "Whether the argument supports or opposes its parent. Unset for the thesis."
  isSupporting: Boolean
  "The argument text, verbatim from the event that created or last altered it (1 to 256 bytes of UTF-8)."
  content: String!
  "The chain time from which the argument counts as final: locked in, tradeable, and tallied."
  finalizationTime: BigInt!
  "The market's pro reserve. The approval - the pro-share price - is con / (pro + con)."
  pro: BigInt!
  con: BigInt!
  "Vote tokens staked on this argument's market (deposit plus net stakes)."
  stake: BigInt!
  "The stake this argument's rating folds into its parent with: its own time-weighted stake plus its whole subtree's. Written by the tally, zero before it."
  subtreeStake: BigInt!
  "The tally's weighted sum of this argument's children's sways - the numerator of their aggregate over `subtreeStake`, and zero until they are rated. Summed from the rating events, so it is the chain's own integer arithmetic rather than an approximation of it."
  descendantsNumerator: BigInt!
  "Unclaimed market fees, claimable by the creator once the debate is finished."
  fees: BigInt!
  "Every market fee the argument has ever earned its creator, claimed or not - what staking on it has paid its author over its lifetime."
  feesEarned: BigInt!
  "The argument's tallied rating: own centered approval and descendants' aggregate blended by the stake behind each, signed - zero is the market's undecided price, negative means refuted (ADR-0012). Its sway on the parent is the rating clamped at zero, negated if it attacks, at its subtree's stake. Only set once the tally has run."
  rating: BigInt
  children: [Argument!]! @derivedFrom(field: "parent")
  stakes: [Stake!]! @derivedFrom(field: "argument")
  redemptions: [Redemption!]! @derivedFrom(field: "argument")
  "The share holdings in this argument's market, one per account that has staked on it - zeroed, not removed, once redeemed."
  positions: [Position!]! @derivedFrom(field: "argument")
}

"A debate participant and their vote-token balance, mirrored from the event stream."
type Participant {
  "`{chainId}_{debateId}_{account}`"
  id: ID!
  debate: Debate!
  account: String!
  tokens: BigInt!
  "The account's share holdings across the debate's arguments; the argumentIds feed `redeemArgumentSharesBatch`."
  positions: [Position!]! @derivedFrom(field: "participant")
}

"An account's current share holdings in one argument's market."
type Position {
  "`{chainId}_{debateId}_{argumentId}_{account}`"
  id: ID!
  argument: Argument!
  "The participant holding the shares, scoped to this debate."
  participant: Participant!
  account: String!
  proShares: BigInt!
  conShares: BigInt!
}

"One stake on an argument's market (history, append-only)."
type Stake {
  "`{chainId}_{blockNumber}_{logIndex}`"
  id: ID!
  argument: Argument!
  staker: String!
  isPro: Boolean!
  voteTokensStaked: BigInt!
  fee: BigInt!
  sharesOut: BigInt!
  timestamp: BigInt!
}

"One post-debate share redemption (history, append-only)."
type Redemption {
  "`{chainId}_{blockNumber}_{logIndex}`"
  id: ID!
  argument: Argument!
  account: String!
  proShares: BigInt!
  conShares: BigInt!
  payout: BigInt!
  timestamp: BigInt!
}

"The kind of registry the factory cloned."
enum RegistryKind {
  ALLOWLIST
  CIRCLES
}

"An identity registry the factory created. A debate names one at creation to decide who may join."
type IdentityRegistry {
  "`{chainId}_{address}` - the registry's address, prefixed with its chain."
  id: ID!
  chainId: Int!
  "The registry's address, lowercase."
  address: String!
  kind: RegistryKind!
  "The factory that cloned it, lowercase. Factories are immutable and superseded by newer ones, so a client can prefer registries from the current factory and label the rest."
  factory: String!
  "The account that keeps the list. Allowlists only; it follows `OwnershipTransferred`."
  owner: String
  "The Circles avatar whose trust admits an account. Circles registries only; the zero address admits every registered human."
  anchor: String
  "Whether an admitted account must also be a registered Circles human. Circles registries only."
  requireHuman: Boolean
  "The chain time the factory created it."
  createdAt: BigInt!
  memberships: [Membership!]! @derivedFrom(field: "registry")
}

"One account's standing on an allowlist. A removed account keeps its row with `member` false, so a list's history stays readable."
type Membership {
  "`{chainId}_{registry}_{account}`"
  id: ID!
  registry: IdentityRegistry!
  account: String!
  member: Boolean!
  "The chain time of the last change."
  updatedAt: BigInt!
}
